name: CI

# Scope: the checks Vercel does NOT run. Vercel's GitHub integration already
# builds every PR (its build runs `pnpm build` = `astro check` + `astro build`),
# so typecheck + build are already gated there. We deliberately do NOT re-run the
# build here — that would be redundant compute. ESLint and Prettier, however, are
# not part of the build, so this workflow's whole job is to surface `pnpm lint` +
# `pnpm format:check` as a pre-merge status check on PRs into main/draft.
#
# Note: this makes the check *visible* (green/red) on PRs. To make it *block*
# merging, mark "Code standards (lint + format)" as a required check in the
# branch protection settings for main/draft (GitHub UI, not this file).

permissions:
  contents: read

on:
  pull_request:
    branches: [main, draft]
  workflow_dispatch:

jobs:
  standards:
    name: Code standards (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v7

      # No pinned version: pnpm/action-setup reads the `packageManager` field in
      # package.json, so local, CI, and Vercel all resolve the same pnpm version
      # from that single source of truth.
      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check
